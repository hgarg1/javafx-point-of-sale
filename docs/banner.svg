<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Point of Sale for JavaFX: checkout, refunds and voids, shifts, purchasing and reports">
  <title>Point of Sale for JavaFX</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <pattern id="bars" width="7" height="30" patternUnits="userSpaceOnUse">
      <rect width="2" height="30" fill="#0f172a"/>
      <rect x="4" width="1" height="30" fill="#0f172a"/>
    </pattern>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#sky)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="72" y="150" font-size="80" font-weight="700">Point of Sale</text>
    <text x="74" y="198" font-size="28" fill="#bfdbfe">Checkout · Refunds · Shifts · Purchasing · Reports</text>
    <text x="74" y="238" font-size="20" fill="#93c5fd">One store, one till, all the data on one computer</text>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="74" y="272" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="133" y="298">Java 26</text>
    <rect x="206" y="272" width="134" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="273" y="298">JavaFX 26</text>
    <rect x="354" y="272" width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="420" y="298">H2 database</text>
  </g>

  <g transform="translate(846 40) rotate(4 126 140)" filter="url(#lift)">
    <rect width="252" height="280" rx="14" fill="#ffffff"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#0f172a">
      <text x="126" y="40" font-size="20" font-weight="700" text-anchor="middle">MY STORE</text>
      <line x1="22" y1="56" x2="230" y2="56" stroke="#cbd5e1" stroke-dasharray="5 5"/>
      <text x="22" y="86" fill="#334155">Espresso Beans 250g</text>
      <text x="230" y="86" fill="#334155" text-anchor="end">14.50</text>
      <text x="22" y="112" fill="#334155">Butter Croissant x3</text>
      <text x="230" y="112" fill="#334155" text-anchor="end">9.75</text>
      <line x1="22" y1="128" x2="230" y2="128" stroke="#cbd5e1" stroke-dasharray="5 5"/>
      <text x="22" y="156" font-size="18" font-weight="700">TOTAL</text>
      <text x="230" y="156" font-size="18" font-weight="700" text-anchor="end">24.25</text>
      <text x="22" y="182" fill="#334155">Cash</text>
      <text x="230" y="182" fill="#334155" text-anchor="end">25.00</text>
      <text x="22" y="208" fill="#334155">Change</text>
      <text x="230" y="208" fill="#334155" text-anchor="end">0.75</text>
    </g>
    <rect x="22" y="226" width="208" height="30" fill="url(#bars)"/>
    <text x="126" y="272" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#64748b" text-anchor="middle">Thank you for shopping with us</text>
  </g>
</svg>
